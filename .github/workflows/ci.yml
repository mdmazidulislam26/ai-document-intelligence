name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: doc_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Tesseract OCR & OpenCV libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            libgl1 \
            libglib2.0-0 \
            libmagic1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply Database Migrations (Alembic)
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_password@localhost:5432/doc_intelligence
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/doc_intelligence
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Run Pytest Test Suite
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_password@localhost:5432/doc_intelligence
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/doc_intelligence
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Production Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
